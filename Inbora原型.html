<!doctype html>
<html lang="zh-CN">

  <title>inbora · 智能客服工作台原型</title>
  <link rel="stylesheet" href="prototype/base.css">

  <div class="app-shell">

      <a class="brand" href="#dashboard" aria-label="inbora 工作台">
        <span class="brand-logo" aria-hidden="true"><i></i><i></i></span>
        <span>inbora</span>
      </a>
      <p class="brand-caption">抖音个人号智能客服工作台</p>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <span class="online-dot"></span><span>inbora</span><span class="prototype-label">交互原型</span>
      </div>

    <div class="workspace">

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
